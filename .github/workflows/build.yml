name: Build

on:
  push:
    branches: [iostreamConfigurable]
    tags: ["v*"]
  pull_request:
    branches: [iostreamConfigurable]
  workflow_dispatch:

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: osx-64
            os: macos-15-intel
          - platform: osx-arm64
            os: macos-15

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false

      - name: Build packages
        run: pixi build --output-dir dist

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Test packages
        run: |
          for pkg in dist/*.conda; do
            echo "Testing $pkg"
            rattler-build test --package-file "$pkg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*.conda
          if-no-files-found: error

  merge-artifacts:
    needs: build
    runs-on: ubuntu-latest
    name: Merge artifacts

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: packages-*
          merge-multiple: true

      - name: Upload merged artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-packages
          path: packages/*.conda
          if-no-files-found: error
